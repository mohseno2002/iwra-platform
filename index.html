<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030a14">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصلحة الري">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>منصة مصلحة الري الرقمية — مركز القيادة v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#030a14;--panel:#081326;--panel2:#0b1a30;--panel3:#0e2140;--line:#153252;--line2:#1d4066;
 --aqua:#00d4ff;--aqua2:#0891b2;--gold:#c9a84c;--gold2:#e8c66a;
 --ok:#2dd48b;--warn:#ffb454;--bad:#ff5470;
 --tx:#e9f2fa;--mut:#7e97b3;--mut2:#54708f;
 --sh:0 14px 40px #00000066;--r:14px;
 --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
 --face:'Cairo',Tahoma,Arial,sans-serif;
}
[data-theme="light"]{
 --bg:#eef4f2;--panel:#ffffff;--panel2:#f4f9f7;--panel3:#e9f2ef;--line:#d5e4df;--line2:#bcd3cc;
 --aqua:#0a7f9e;--aqua2:#0a6e8a;--gold:#8a6c22;--gold2:#6e551a;
 --ok:#0f8f5f;--warn:#a86a00;--bad:#c22b47;
 --tx:#12312c;--mut:#5a746f;--mut2:#7d938f;
 --sh:0 10px 30px #0a4a4014;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--face);font-size:13px;line-height:1.75;
 background-image:radial-gradient(1100px 500px at 88% -8%,#0a355522,transparent),radial-gradient(900px 460px at 0% 108%,#c9a84c0d,transparent)}
[data-theme="light"] body,body[data-theme="light"]{background-image:none}
::selection{background:#00d4ff33}
.num,input[type=number],td.n,.mono{font-family:var(--mono);direction:ltr;unicode-bidi:embed;letter-spacing:.2px}
a{color:var(--aqua)}
h1,h2,h3{font-weight:900;letter-spacing:-.2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* ---------- الهيكل ---------- */
.shell{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--panel),var(--panel) 70%,#081326e0);border-left:1px solid var(--line);padding:16px 14px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:16}
[data-theme="light"] .side{background:var(--panel)}
.logo{display:flex;align-items:center;gap:11px;padding:4px 6px 15px;border-bottom:1px solid var(--line)}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(140deg,var(--aqua2),#064d63);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:900;box-shadow:inset 0 0 0 1px #ffffff22,0 6px 18px #00d4ff22;flex:none}
[data-theme="light"] .mark{background:linear-gradient(140deg,#0a6e63,#064d47)}
.logo b{display:block;font-size:14.5px}
.logo small{display:block;font-size:9.5px;color:var(--mut);margin-top:2px;letter-spacing:.4px}
.nav{overflow:auto;flex:1;margin-top:6px;padding-bottom:8px}
.navtitle{font-size:9px;color:var(--mut2);margin:16px 9px 6px;letter-spacing:2.5px;font-weight:700}
.nav button{width:100%;display:flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 11px;text-align:right;font-weight:700;font-size:12.5px;color:var(--mut);cursor:pointer;margin:2px 0;font-family:var(--face);transition:.15s}
.nav button i{font-style:normal;width:20px;text-align:center;font-size:15px;opacity:.9}
.nav button:hover{background:var(--panel2);color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,#00d4ff14,transparent);border-color:var(--line2);color:var(--gold2)}
[data-theme="light"] .nav button.on{background:#0a7f9e12;color:#0a6e63}
.nav button.on i{color:var(--aqua)}
.sfoot{border-top:1px solid var(--line);padding-top:10px;font-size:9.5px;color:var(--mut);line-height:1.9}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:99px;padding:2px 9px;font-size:9px;color:var(--mut);background:var(--panel2)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.chip.off i{background:var(--warn)}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:60px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;z-index:12}
.men{display:none;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);border-radius:9px;padding:7px 11px;font-size:15px;cursor:pointer}
.crumb{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:7px;min-width:0}
.crumb b{color:var(--tx);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--mut2)}
.tsp{flex:1}
.tbtn{border:1px solid var(--line2);background:var(--panel2);color:var(--mut);border-radius:10px;padding:7.5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--face);display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.tbtn:hover{color:var(--tx);border-color:var(--aqua2)}
.tbtn kbd{font-family:var(--mono);font-size:9px;border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--mut2)}
.clock{font-family:var(--mono);font-size:11px;color:var(--aqua);border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:7px 12px;direction:ltr;white-space:nowrap}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-left:6px;animation:pl 2s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 #2dd48b55}50%{box-shadow:0 0 0 6px transparent}}

.wrap{padding:24px;max-width:1480px;margin:0 auto;width:100%}

/* ---------- البطولة والمؤشرات ---------- */
.hero{background:linear-gradient(125deg,#052b46,#083a55 55%,#0a4a63);border:1px solid var(--line2);border-radius:20px;color:#eaf6ff;padding:30px 32px;position:relative;overflow:hidden;box-shadow:var(--sh)}
[data-theme="light"] .hero{background:linear-gradient(125deg,#0a5a50,#0c7466);border-color:#0a5a50;color:#f2fbf9}
.hero:after{content:"≈";position:absolute;left:30px;top:-70px;font-size:300px;color:#ffffff0a;transform:rotate(-16deg);pointer-events:none}
.eyebrow{font-size:9.5px;color:var(--gold2);font-weight:700;letter-spacing:2.5px}
[data-theme="light"] .eyebrow{color:#ffe9ad}
.hero h1{font-size:27px;margin:10px 0 8px;line-height:1.35}
.hero p{font-size:12px;line-height:2.1;color:#bcd9ea;max-width:680px;margin:0}
[data-theme="light"] .hero p{color:#d8efe9}
.hero .acts{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap}
.hbtn{border:0;border-radius:10px;background:#fff;color:#08405c;padding:10.5px 17px;font-weight:900;font-size:12px;cursor:pointer;font-family:var(--face)}
.hbtn.g{background:transparent;border:1px solid #ffffff55;color:#fff}
.ticker{margin-top:16px;border-top:1px dashed #ffffff2e;padding-top:11px;font-size:10.5px;color:#ffdf9e;display:flex;gap:22px;overflow:hidden;white-space:nowrap}
.ticker span{display:inline-flex;gap:6px;align-items:center}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden;transition:.15s}
.kpi:hover{border-color:var(--line2)}
.kpi>span{display:block;color:var(--mut);font-size:10px;font-weight:700}
.kpi b{display:flex;align-items:baseline;gap:6px;font-size:24px;margin:7px 0 2px;font-family:var(--mono);direction:ltr;justify-content:flex-end}
.kpi b u{text-decoration:none;font-size:10px;color:var(--mut);font-family:var(--face)}
.kpi small{color:var(--ok);font-size:9.5px;font-weight:700}
.kpi small.w{color:var(--warn)}.kpi small.b{color:var(--bad)}
.kpi svg{position:absolute;left:10px;bottom:8px;opacity:.85}
.kpi.alert b{color:var(--bad)}

/* ---------- الرؤوس والبطاقات ---------- */
.head{display:flex;align-items:end;justify-content:space-between;margin:26px 0 12px;gap:10px;flex-wrap:wrap}
.head h2{font-size:17.5px;margin:3px 0}
.head span{font-size:9px;color:var(--gold);font-weight:700;letter-spacing:2px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:16px;text-align:right;cursor:pointer;min-height:148px;transition:.18s;font-family:var(--face);color:var(--tx);position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);border-color:var(--aqua2);box-shadow:0 14px 38px #00121f66}
[data-theme="light"] .card:hover{box-shadow:0 14px 34px #0a4a4018}
.ico{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#0a3550,#0b2740);border:1px solid var(--line2);color:var(--aqua);display:grid;place-items:center;font-size:18px;font-weight:900;flex:none}
[data-theme="light"] .ico{background:#e6f3f0;border-color:#cfe4de;color:#0a6e63}
.card h3{font-size:13px;margin:12px 0 6px}
.card p{font-size:10.5px;color:var(--mut);line-height:1.85;margin:0;flex:1}
.card em{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:9px;color:var(--aqua);font-size:9.5px;font-style:normal;font-weight:700}
.badge{font-size:8.5px;font-weight:900;border-radius:99px;padding:2.5px 9px;letter-spacing:.5px}
.badge.tool{background:#00d4ff1a;color:var(--aqua);border:1px solid #00d4ff40}
.badge.scope{background:#c9a84c1a;color:var(--gold2);border:1px solid #c9a84c40}
.badge.demo{background:#ffb4541c;color:var(--warn);border:1px solid #ffb45445}
[data-theme="light"] .badge.tool{background:#0a7f9e14}
[data-theme="light"] .badge.scope{background:#8a6c2214}

.sectorhero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.sectorhero h1{font-size:22px;margin:7px 0 5px}
.sectorhero p{font-size:11.5px;color:var(--mut);margin:0;max-width:760px}
.org{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.org div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:11.5px;font-weight:700}
.org small{display:block;color:var(--mut);margin-top:4px;font-weight:400;font-family:var(--mono);direction:ltr;text-align:right}

/* ---------- لوحات الأدوات ---------- */
.tgrid{display:grid;grid-template-columns:390px 1fr;gap:14px;align-items:start;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px}
.panel h3{margin:0 0 11px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.panel h3:before{content:"";width:3.5px;height:15px;border-radius:3px;background:var(--gold);display:inline-block}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.frm .full{grid-column:1/-1}
label{display:block}
label span{display:block;font-size:9.5px;color:var(--mut);font-weight:700;margin-bottom:4px}
label span em{font-style:normal;color:var(--mut2);font-family:var(--mono);font-size:8.5px}
input,select,textarea{width:100%;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);border-radius:9px;padding:8.5px 11px;font-size:12px;font-family:var(--face);outline:0;transition:.15s}
input[type=number]{font-family:var(--mono);direction:ltr;text-align:left}
input:focus,select:focus,textarea:focus{border-color:var(--aqua2);box-shadow:0 0 0 3px #00d4ff1a}
select{cursor:pointer}
textarea{min-height:64px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:900;font-size:12px;cursor:pointer;font-family:var(--face);display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn.p{background:linear-gradient(140deg,var(--aqua2),#065a76);color:#fff;box-shadow:0 6px 16px #00d4ff22}
[data-theme="light"] .btn.p{background:linear-gradient(140deg,#0a7f6f,#0a6e63)}
.btn.p:hover{filter:brightness(1.12)}
.btn.g{background:var(--panel2);border:1px solid var(--line2);color:var(--mut)}
.btn.g:hover{color:var(--tx)}
.btn.gold{background:#c9a84c22;border:1px solid #c9a84c55;color:var(--gold2)}
.btn.d{background:#ff547018;border:1px solid #ff547045;color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:10.5px;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.rbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.rbox span{display:block;font-size:9px;color:var(--mut);font-weight:700}
.rbox b{display:block;font-family:var(--mono);direction:ltr;text-align:right;font-size:16.5px;margin-top:4px;color:var(--aqua)}
.rbox b u{text-decoration:none;font-size:9px;color:var(--mut);font-family:var(--face)}
.rbox.gold b{color:var(--gold2)}
.rbox.ok b{color:var(--ok)}.rbox.warn b{color:var(--warn)}.rbox.bad b{color:var(--bad)}
.verdict{border-radius:11px;padding:11px 14px;font-size:11.5px;font-weight:700;margin-top:10px;border:1px solid}
.verdict.ok{background:#2dd48b12;border-color:#2dd48b40;color:var(--ok)}
.verdict.warn{background:#ffb45412;border-color:#ffb45440;color:var(--warn)}
.verdict.bad{background:#ff547012;border-color:#ff547040;color:var(--bad)}
.verdict.info{background:#00d4ff10;border-color:#00d4ff35;color:var(--aqua)}

details.trace{margin-top:12px;border:1px dashed var(--line2);border-radius:11px;background:var(--panel2)}
details.trace summary{cursor:pointer;padding:10px 14px;font-size:11px;font-weight:900;color:var(--gold2);list-style:none;display:flex;align-items:center;gap:8px}
details.trace summary:after{content:"▾";margin-right:auto;color:var(--mut2);transition:.2s}
details.trace[open] summary:after{transform:rotate(180deg)}
.tr-steps{padding:2px 14px 13px;display:grid;gap:7px}
.tr-s{border-right:2px solid var(--line2);padding-right:11px}
.tr-s .k{font-size:10px;color:var(--mut);font-weight:700}
.tr-s .f{font-family:var(--mono);direction:ltr;text-align:right;font-size:11px;color:var(--tx);margin:2px 0}
.tr-s .s{font-family:var(--mono);direction:ltr;text-align:right;font-size:10.5px;color:var(--mut)}
.tr-s .r{font-family:var(--mono);direction:ltr;text-align:right;font-size:11.5px;color:var(--aqua);font-weight:700}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--mut);font-family:var(--face);font-weight:700;font-size:11.5px;padding:9px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--aqua);border-color:var(--aqua)}
.tabc{display:none}.tabc.on{display:block}

table.dt{width:100%;border-collapse:collapse;font-size:11px}
table.dt th{background:var(--panel3);color:var(--mut);font-size:9.5px;letter-spacing:.4px;padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);position:sticky;top:0}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt td.n{text-align:left;color:var(--aqua)}
table.dt tr:hover td{background:#00d4ff06}
.tblwrap{overflow:auto;max-height:430px;border:1px solid var(--line);border-radius:11px}
.pill{font-size:9px;font-weight:900;border-radius:99px;padding:2px 9px;display:inline-block}
.pill.ok{background:#2dd48b1c;color:var(--ok)}.pill.warn{background:#ffb4541c;color:var(--warn)}.pill.bad{background:#ff54701c;color:var(--bad)}.pill.info{background:#00d4ff18;color:var(--aqua)}.pill.mut{background:var(--panel3);color:var(--mut)}
.xdel{border:0;background:transparent;color:var(--mut2);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px}
.xdel:hover{color:var(--bad);background:#ff547015}

.scope{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.scope .panel ul{margin:6px 0 0;padding:0 18px 0 0;font-size:11.5px;color:var(--mut);line-height:2.1}
.scope .panel ul li::marker{color:var(--gold)}
.progress{height:7px;border-radius:99px;background:var(--panel3);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--aqua2),var(--aqua))}

svg text{font-family:var(--mono)}
svg .artx{font-family:var(--face)}
.flow{stroke-dasharray:7 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}.livedot{animation:none}*{transition:none!important}}

/* ---------- المودال واللوحة والتنبيهات ---------- */
.modalbg{display:none;position:fixed;inset:0;background:#010810cc;z-index:30;padding:20px;place-items:center;backdrop-filter:blur(4px)}
.modalbg.show{display:grid}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:24px;width:min(520px,100%);position:relative;box-shadow:var(--sh);max-height:88vh;overflow:auto}
.modal .x{position:absolute;left:14px;top:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--mut);border-radius:9px;width:31px;height:31px;font-size:17px;cursor:pointer}
.pal{display:none;position:fixed;inset:0;background:#010810d0;z-index:35;padding:12vh 18px 18px;justify-content:center;backdrop-filter:blur(5px)}
.pal.show{display:flex}
.palbox{width:min(620px,100%);height:fit-content;background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.palbox input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 17px;font-size:14px;background:transparent}
.palbox input:focus{box-shadow:none}
.plist{max-height:52vh;overflow:auto;padding:7px}
.pitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:12px}
.pitem:hover,.pitem.sel{background:var(--panel2)}
.pitem .ico{width:30px;height:30px;font-size:14px;border-radius:8px}
.pitem small{display:block;color:var(--mut);font-size:9.5px}
.pitem .tag{margin-right:auto;font-size:8.5px;color:var(--mut2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.phint{padding:9px 15px;font-size:9.5px;color:var(--mut2);border-top:1px solid var(--line);display:flex;gap:14px}
#toasts{position:fixed;bottom:18px;left:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line2);border-right:3px solid var(--aqua);border-radius:11px;padding:11px 15px;font-size:11.5px;font-weight:700;box-shadow:var(--sh);animation:tin .25s ease;max-width:320px}
.toast.ok{border-right-color:var(--ok)}.toast.bad{border-right-color:var(--bad)}.toast.warn{border-right-color:var(--warn)}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.alertrow{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--panel)}
.alertrow .sv{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.alertrow.bad .sv{background:var(--bad);box-shadow:0 0 0 4px #ff547022}
.alertrow.warn .sv{background:var(--warn);box-shadow:0 0 0 4px #ffb45422}
.alertrow b{display:block;font-size:12px}
.alertrow small{color:var(--mut);font-size:10px}
.empty{border:1px dashed var(--line2);border-radius:13px;padding:26px;text-align:center;color:var(--mut);font-size:11.5px}
.empty b{display:block;font-size:13px;color:var(--tx);margin-bottom:5px}

/* ---------- تقرير الطباعة ---------- */
#rpt{display:none}
@media print{
 body{background:#fff;color:#000}
 body.rp .shell,body.rp #toasts,body.rp .pal,body.rp .modalbg{display:none!important}
 body.rp #rpt{display:block;font-size:12px;color:#000}
 #rpt h1{font-size:18px;margin:4px 0}
 #rpt .rhead{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #000;padding-bottom:8px;margin-bottom:12px}
 #rpt table{width:100%;border-collapse:collapse;margin:8px 0 14px}
 #rpt th,#rpt td{border:1px solid #333;padding:6px 8px;font-size:11px;text-align:right}
 #rpt th{background:#eee}
 #rpt .sig{display:flex;justify-content:space-between;margin-top:44px;text-align:center;font-weight:700}
 #rpt .sig div{width:200px;border-top:1px dotted #000;padding-top:6px}
}
@media(max-width:1080px){.tgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}.scope{grid-template-columns:1fr}}
@media(max-width:900px){
 .shell{display:block}
 .side{position:fixed;right:0;top:0;width:280px;transform:translateX(105%);transition:.25s;box-shadow:-25px 0 60px #000a;z-index:40}
 .side.open{transform:translateX(0)}
 .men{display:block}
 .wrap{padding:14px}
 .clock{display:none}
 .org{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){.hero{padding:22px 18px}.hero h1{font-size:21px}.cards{grid-template-columns:1fr}.kpi b{font-size:19px}.org{grid-template-columns:1fr}.frm{grid-template-columns:1fr}.tbtn.hidem{display:none}}
a.btn{text-decoration:none}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.apptile{display:flex;flex-direction:column;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 8px 12px;text-decoration:none;color:var(--tx);text-align:center;transition:.16s;position:relative}
.apptile:hover{transform:translateY(-2px);border-color:var(--aqua2);box-shadow:0 12px 30px #00121f66}
[data-theme="light"] .apptile:hover{box-shadow:0 12px 26px #0a4a4016}
.apptile .ico{width:46px;height:46px;font-size:22px;border-radius:13px;display:grid;place-items:center}
.apptile b{font-size:10px;font-weight:700;line-height:1.65;min-height:33px;display:flex;align-items:center}
.apptile i{position:absolute;top:8px;left:9px;font-style:normal;font-size:9px;color:var(--mut2)}
.apptile:hover i{color:var(--aqua)}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px;margin-bottom:4px}
.lvcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.lvh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.lvh .ico{width:30px;height:30px;font-size:14px;border-radius:9px}
.lvh b{font-size:11px;flex:1;line-height:1.5}
.lvdot{width:8px;height:8px;border-radius:50%;background:var(--mut2);flex:none}
.lvdot.ok{background:var(--ok);box-shadow:0 0 0 3px #2dd48b22}.lvdot.warn{background:var(--warn)}.lvdot.bad{background:var(--bad)}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding:4.5px 0;font-size:10.5px;color:var(--mut)}
.lvrow b{font-family:var(--mono);direction:ltr;color:var(--aqua);font-size:13.5px}
.lvmeta{font-size:8.5px;color:var(--mut2);margin-top:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.lvft{display:flex;gap:6px;margin-top:9px}
.card em a,.card em button{font-style:normal}
.lkhost{font-family:var(--mono);direction:ltr;text-align:right;font-size:9px;color:var(--mut2);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function stp(k,f,s,r){return{k:k,f:f,s:s,r:r}}
var ENG=(function(){
 var g=9.81;
 function sec(b,m,y){var A=(b+m*y)*y,T=b+2*m*y,P=b+2*y*Math.sqrt(1+m*m);return{A:A,T:T,P:P,R:P>0?A/P:0}}
 function bis(f,lo,hi){var fl=f(lo),fh=f(hi);if(!isFinite(fl)||!isFinite(fh)||fl*fh>0)return NaN;
  for(var i=0;i<110;i++){var md=(lo+hi)/2,fm=f(md);if(!isFinite(fm))return NaN;
   if(Math.abs(fm)<1e-10||(hi-lo)<1e-8)return md;
   if(fl*fm<=0){hi=md;fh=fm}else{lo=md;fl=fm}}return (lo+hi)/2}
 function qman(b,m,y,n,S){var s=sec(b,m,y);return(1/n)*s.A*Math.pow(s.R,2/3)*Math.sqrt(S)}
 function yN(Q,b,m,n,S){var f=function(y){return qman(b,m,y,n,S)-Q};var hi=1,k=0;
  while(f(hi)<0&&k<70){hi*=1.5;k++}if(f(hi)<0)return NaN;return bis(f,1e-5,hi)}
 function yC(Q,b,m){var f=function(y){var s=sec(b,m,y);return Q*Q*s.T/(g*Math.pow(s.A,3))-1};
  var hi=1,k=0;while(f(hi)>0&&k<70){hi*=1.5;k++}if(f(hi)>0)return NaN;return bis(f,1e-5,hi)}
 function frd(Q,b,m,y){var s=sec(b,m,y);var v=Q/s.A;return v/Math.sqrt(g*s.A/s.T)}

 /* --- ١) التصرف من عمق معلوم --- */
 function flowFromDepth(o){var b=o.b,m=o.m,n=o.n,S=o.S,y=o.y;var tr=[];
  var s=sec(b,m,y);var Q=qman(b,m,y,n,S);var Vv=Q/s.A;var Fr=frd(Q,b,m,y);
  tr.push(stp('عناصر القطاع','A=(b+m·y)·y ، P=b+2y√(1+m²) ، R=A/P',
   'A=('+fmt(b,2)+'+'+fmt(m,2)+'×'+fmt(y,2)+')×'+fmt(y,2)+' ، P='+fmt(b,2)+'+2×'+fmt(y,2)+'×√(1+'+fmt(m*m,2)+')',
   'A='+fmt(s.A,3)+' m² ، R='+fmt(s.R,3)+' m'));
  tr.push(stp('معادلة مانينج','Q=(1/n)·A·R^(2/3)·√S',
   'Q=(1/'+fmt(n,3)+')×'+fmt(s.A,3)+'×'+fmt(s.R,3)+'^0.667×√'+S,
   'Q='+fmt(Q,3)+' m³/s'));
  tr.push(stp('السرعة ورقم فرود','V=Q/A ، Fr=V/√(g·A/T)',
   'V='+fmt(Q,3)+'/'+fmt(s.A,3)+' ، Fr='+fmt(Vv,3)+'/√(9.81×'+fmt(s.A/s.T,3)+')',
   'V='+fmt(Vv,3)+' m/s ، Fr='+fmt(Fr,3)));
  var reg=Fr<0.99?'سريان هادئ (تحت حرج)':(Fr>1.01?'سريان جارف (فوق حرج)':'سريان حرج');
  var vv=Vv<0.30?['السرعة أقل من حد الإطماء (0.30 م/ث) — متوقَّع ترسيب','warn']:
        (Vv>1.50?['السرعة أعلى من حد النحر التقريبي للقنوات الترابية (1.50 م/ث)','bad']:
        ['السرعة ضمن النطاق الآمن (0.30 – 1.50 م/ث) للقنوات الترابية','ok']);
  return{Q:Q,V:Vv,Fr:Fr,A:s.A,R:s.R,T:s.T,reg:reg,vTxt:vv[0],vCls:vv[1],trace:tr}}

 /* --- ٢) الأعماق من تصرف معلوم --- */
 function depthsFromQ(o){var b=o.b,m=o.m,n=o.n,S=o.S,Q=o.Q;var tr=[];
  var yn=yN(Q,b,m,n,S),yc=yC(Q,b,m);
  tr.push(stp('العمق الطبيعي yₙ','حل مانينج عدديًا: Q=(1/n)·A(y)·R(y)^(2/3)·√S','حل بالتنصيف حتى دقة 10⁻⁸ م','yₙ='+fmt(yn,3)+' m'));
  tr.push(stp('العمق الحرج y꜀','شرط الحرجية: Q²·T/(g·A³)=1','حل بالتنصيف حتى دقة 10⁻⁸ م','y꜀='+fmt(yc,3)+' m'));
  var sn=sec(b,m,yn),Vn=Q/sn.A,Frn=frd(Q,b,m,yn);
  tr.push(stp('عند العمق الطبيعي','V=Q/A ، Fr=V/√(g·A/T)','V='+fmt(Q,2)+'/'+fmt(sn.A,3),'V='+fmt(Vn,3)+' m/s ، Fr='+fmt(Frn,3)));
  var slope=(isFinite(yn)&&isFinite(yc))?(yn>yc?'ميل ضعيف (Mild) — التحكم من الخلف':'ميل شديد (Steep) — التحكم من الأمام'):'—';
  return{yn:yn,yc:yc,Vn:Vn,Frn:Frn,slope:slope,trace:tr}}

 /* --- ٣) منحنى المياه الراجعة GVF بطريقة RK4 --- */
 function gvf(o){var b=o.b,m=o.m,n=o.n,S0=o.S,Q=o.Q,y0=o.y0;
  var dx=o.dx||50,Lx=o.L||30000;var tr=[];
  var yn=yN(Q,b,m,n,S0),yc=yC(Q,b,m);
  function Sf(y){var s=sec(b,m,y);return Math.pow(n*Q/(s.A*Math.pow(s.R,2/3)),2)}
  function Fr2(y){var s=sec(b,m,y);return Q*Q*s.T/(g*Math.pow(s.A,3))}
  function fUp(y){var d=1-Fr2(y);if(Math.abs(d)<2e-3)d=(d<0?-2e-3:2e-3);return -((S0-Sf(y))/d)}
  var pts=[{x:0,y:y0}],y=y0,s=0,stop='length',L1=null;
  var N=Math.max(4,Math.floor(Lx/dx));
  for(var i=0;i<N;i++){var h=dx;
   var k1=fUp(y),k2=fUp(y+h*k1/2),k3=fUp(y+h*k2/2),k4=fUp(y+h*k3);
   var y2=y+h*(k1+2*k2+2*k3+k4)/6;s+=dx;
   if(!isFinite(y2)||y2<=0){stop='divergence';break}
   pts.push({x:s,y:y2});
   if(L1===null&&isFinite(yn)&&Math.abs(y2-yn)<=0.01*yn)L1=s;
   if(isFinite(yn)&&Math.abs(y2-yn)<=0.003*yn){stop='asymptote';y=y2;break}
   if(isFinite(yc)&&y2<=yc*1.005){stop='critical';y=y2;break}
   y=y2}
  var prof='—';
  if(isFinite(yn)&&isFinite(yc)){
   if(yn>yc)prof=(y0>yn?'M1 — ارتفاع منسوب خلف منشأ (مياه راجعة)':(y0>yc?'M2 — انخفاض نحو سقوط حر/مأخذ':'M3 — خلف بوابة بتصرف جارف'));
   else prof=(y0>yc?'S1 — خلف منشأ على ميل شديد':(y0>yn?'S2':'S3'))}
  tr.push(stp('المعادلة الحاكمة','dy/dx=(S₀−S_f)/(1−Fr²) ، S_f=(n·Q)²/(A²·R^{4/3})','تكامل عددي RK4 عكس الاتجاه بخطوة Δx='+fmt(dx,0)+' م','عدد النقاط='+pts.length));
  tr.push(stp('الأعماق المرجعية','yₙ من مانينج ، y꜀ من شرط الحرجية','—','yₙ='+fmt(yn,3)+' م ، y꜀='+fmt(yc,3)+' م'));
  if(L1!==null)tr.push(stp('المدى المؤثر','المسافة حتى |y−yₙ|≤1%','قراءة من ناتج التكامل','L₉₉='+fmt(L1/1000,2)+' كم'));
  return{pts:pts,yn:yn,yc:yc,prof:prof,stop:stop,L1:L1,end:y,dist:s,trace:tr}}

 /* --- ٤) بوابات (فتحات) --- */
 function gateQ(a,o){var H1=o.H1,H2=o.H2,B=o.B,N=o.N||1;
  var mode=o.mode;if(mode==='auto')mode=(isFinite(H2)&&H2>a)?'sub':'free';
  var Cd=(o.Cd||0.58),Cs=(o.Cs||0.80),q1;
  if(mode==='free')q1=Cd*B*a*Math.sqrt(2*g*H1);
  else q1=Cs*B*a*Math.sqrt(2*g*Math.max(H1-H2,0));
  return{Q:q1*N,q1:q1,mode:mode,Cd:Cd,Cs:Cs}}
 function gateFlow(o){var r=gateQ(o.a,o);var tr=[];
  var head=(r.mode==='free')?o.H1:(o.H1-o.H2);
  tr.push(stp('نمط السريان',r.mode==='free'?'حر: عمق المؤخر ≤ فتحة البوابة':'مغمور: عمق المؤخر أعلى من فتحة البوابة','H₂='+fmt(o.H2,2)+' م مقابل a='+fmt(o.a,2)+' م',r.mode==='free'?'سريان حر':'سريان مغمور'));
  tr.push(stp('تصرف الفتحة الواحدة',r.mode==='free'?'q=C_d·B·a·√(2g·H₁)':'q=C_s·B·a·√(2g·(H₁−H₂))',
   'q='+fmt(r.mode==='free'?r.Cd:r.Cs,2)+'×'+fmt(o.B,2)+'×'+fmt(o.a,2)+'×√(19.62×'+fmt(head,2)+')','q='+fmt(r.q1,3)+' m³/s'));
  tr.push(stp('إجمالي الفتحات','Q=N×q','Q='+(o.N||1)+'×'+fmt(r.q1,3),'Q='+fmt(r.Q,3)+' m³/s'));
  var vj=Math.sqrt(2*g*head);
  return{Q:r.Q,q1:r.q1,mode:r.mode,vj:vj,trace:tr}}
 function gateSolveA(o){var f=function(a){return gateQ(a,o).Q-o.Qt};
  var hi=Math.max(0.05,(isFinite(o.H1)?o.H1:3)*0.95);
  var a=bis(f,0.005,hi);var tr=[];
  if(isFinite(a)){var r=gateQ(a,o);
   tr.push(stp('حل عكسي للفتحة','إيجاد a بحيث Q(a)=Q_target بالتنصيف','مدى البحث a∈[0.005،'+fmt(hi,2)+'] م','a='+fmt(a,3)+' م'));
   tr.push(stp('تحقق','Q(a) بعد الحل','—','Q='+fmt(r.Q,3)+' m³/s ('+(r.mode==='free'?'حر':'مغمور')+')'));
   return{a:a,Q:r.Q,mode:r.mode,trace:tr}}
  return{a:NaN,trace:[stp('تعذر الحل','التصرف المستهدف خارج قدرة الفتحات بالمناسيب الحالية','جرّب زيادة عدد الفتحات أو مراجعة المناسيب','—')]}}

 /* --- ٥) هدارات --- */
 function weir(o){var B=o.B,H1=o.H1,H2=o.H2||0,Cd=o.Cd||1,tr=[];
  var C=(o.type==='sharp')?1.84:1.705;
  var Q0=Cd*C*B*Math.pow(H1,1.5);
  tr.push(stp('معادلة الهدار','Q='+(o.type==='sharp'?'1.84':'1.705')+'·C·B·H^{1.5}','Q='+fmt(Cd,2)+'×'+C+'×'+fmt(B,2)+'×'+fmt(H1,2)+'^1.5','Q₀='+fmt(Q0,3)+' m³/s'));
  var f=1,sub=false;
  if(H2>0&&H2<H1){sub=true;f=Math.pow(1-Math.pow(H2/H1,1.5),0.385);
   tr.push(stp('تصحيح الغمر (Villemonte)','f=[1−(H₂/H₁)^{1.5}]^{0.385}','f=[1−('+fmt(H2,2)+'/'+fmt(H1,2)+')^1.5]^0.385','f='+fmt(f,3)))}
  var Q=Q0*f;
  tr.push(stp('التصرف النهائي','Q=f×Q₀','Q='+fmt(f,3)+'×'+fmt(Q0,3),'Q='+fmt(Q,3)+' m³/s'));
  return{Q:Q,f:f,sub:sub,trace:tr}}

 /* --- ٦) معايرة منحنى القياس Q=C·(G−G₀)ⁿ --- */
 function ratingFit(pts,g0mode){var P=pts.filter(function(p){return isFinite(p.g)&&isFinite(p.q)&&p.q>0});
  if(P.length<3)return{err:'يلزم ٣ نقاط صالحة على الأقل'};
  var gmin=Math.min.apply(null,P.map(function(p){return p.g}));
  function fit(g0){var n=0,sx=0,sy=0,sxx=0,sxy=0,i;
   for(i=0;i<P.length;i++){var d=P[i].g-g0;if(d<=0)return null;
    var x=Math.log(d),y=Math.log(P[i].q);n++;sx+=x;sy+=y;sxx+=x*x;sxy+=x*y}
   var den=n*sxx-sx*sx;if(Math.abs(den)<1e-12)return null;
   var b1=(n*sxy-sx*sy)/den,a0=(sy-b1*sx)/n;
   var ssr=0,sst=0,ym=sy/n;
   for(i=0;i<P.length;i++){var yy=Math.log(P[i].q),yh=a0+b1*Math.log(P[i].g-g0);ssr+=(yy-yh)*(yy-yh);sst+=(yy-ym)*(yy-ym)}
   return{C:Math.exp(a0),n:b1,g0:g0,R2:sst>0?1-ssr/sst:1}}
  var best=null;
  if(g0mode==='auto'){var lo=Math.min(0,gmin-2),steps=80;
   for(var k=0;k<steps;k++){var g0=lo+(gmin-0.002-lo)*k/(steps-1);var r=fit(g0);
    if(r&&(!best||r.R2>best.R2))best=r}}
  else best=fit(g0mode);
  if(!best)return{err:'تعذرت الملاءمة — راجع النقاط ومنسوب الصفر'};
  var tr=[stp('التحويل اللوغاريتمي','ln Q = ln C + n·ln(G−G₀)','انحدار خطي بالمربعات الصغرى على '+P.length+' نقطة','C='+fmt(best.C,4)+' ، n='+fmt(best.n,3)),
   stp('منسوب الصفر G₀',g0mode==='auto'?'مسح شبكي لتعظيم R²':'قيمة مُدخلة','—','G₀='+fmt(best.g0,3)+' م'),
   stp('جودة الملاءمة','R² على اللوغاريتمات','—','R²='+fmt(best.R2,4))];
  best.f=function(gg){return best.C*Math.pow(Math.max(gg-best.g0,0),best.n)};
  best.trace=tr;best.N=P.length;return best}

 /* --- ٧) المناوبات: زمام × مقنن --- */
 function rotation(o){var Z=o.Z,duty=o.duty,on=o.on,off=o.off,tr=[];
  var Qd=Z*duty;var Qc=Qd/86400;var cyc=on+off;var Qr=Qc*cyc/on;var qls=duty/86.4;
  tr.push(stp('الاحتياج اليومي','V=زمام×مقنن','V='+fmt(Z,0)+'×'+fmt(duty,1),'V='+fmt(Qd,0)+' م³/يوم'));
  tr.push(stp('التصرف المستمر المكافئ','Q꜀=V/86400','Q꜀='+fmt(Qd,0)+'/86400','Q꜀='+fmt(Qc,3)+' م³/ث'));
  tr.push(stp('تصرف فترة العمالة','Q_r=Q꜀×(عمالة+بطالة)/عمالة','Q_r='+fmt(Qc,3)+'×'+cyc+'/'+on,'Q_r='+fmt(Qr,3)+' م³/ث'));
  tr.push(stp('المعدل النوعي','q=مقنن/86.4','q='+fmt(duty,1)+'/86.4','q='+fmt(qls,3)+' لتر/ث/فدان'));
  return{Qd:Qd,Qc:Qc,Qr:Qr,qls:qls,cyc:cyc,trace:tr}}

 /* --- ٨) الاحتياجات المائية FAO-56 --- */
 function demandFao(o){var tr=[];var ETc=o.kc*o.et0;var NIR=Math.max(ETc-(o.pe||0),0);var GIR=NIR/(o.eff||0.7);
  var v=GIR*4.2*o.area;var qls=v*1000/86400;var duty=GIR*4.2;
  tr.push(stp('البخرنتح المحصولي','ETc=Kc×ETo','ETc='+fmt(o.kc,2)+'×'+fmt(o.et0,2),'ETc='+fmt(ETc,2)+' مم/يوم'));
  tr.push(stp('صافي الاحتياج','NIR=ETc−Pe','NIR='+fmt(ETc,2)+'−'+fmt(o.pe||0,2),'NIR='+fmt(NIR,2)+' مم/يوم'));
  tr.push(stp('الاحتياج الكلي','GIR=NIR/η','GIR='+fmt(NIR,2)+'/'+fmt(o.eff,2),'GIR='+fmt(GIR,2)+' مم/يوم'));
  tr.push(stp('الحجم اليومي','V=GIR×4.2×المساحة (1مم على الفدان=4.2م³)','V='+fmt(GIR,2)+'×4.2×'+fmt(o.area,0),'V='+fmt(v,0)+' م³/يوم'));
  return{ETc:ETc,NIR:NIR,GIR:GIR,v:v,qls:qls,duty:duty,trace:tr}}

 /* --- ٩) هبوط بئر Cooper–Jacob --- */
 function wellCJ(o){var Q=o.Q,T=o.T,Sy=o.S,r=o.r,t=o.t,tr=[];
  var u=r*r*Sy/(4*T*t);
  var s=(2.303*Q/(4*Math.PI*T))*(Math.log(2.25*T*t/(r*r*Sy))/Math.LN10);
  tr.push(stp('وسيط بوثايس','u=r²S/(4Tt)','u='+fmt(r,1)+'²×'+o.S+'/(4×'+fmt(T,0)+'×'+fmt(t,2)+')','u='+u.toExponential(2)));
  tr.push(stp('تقريب Cooper–Jacob','s=(2.303Q/4πT)·log(2.25Tt/r²S)','s=(2.303×'+fmt(Q,0)+'/(4π×'+fmt(T,0)+'))×log('+fmt(2.25*T*t/(r*r*Sy),1)+')','s='+fmt(s,3)+' م'));
  var ok=u<0.05;
  tr.push(stp('صلاحية التقريب','يشترط u<0.05','u='+u.toExponential(2),ok?'التقريب صالح':'u كبيرة — استخدم Theis الكاملة'));
  return{s:s,u:u,ok:ok,trace:tr}}

 /* --- ١٠) تصنيف ملوحة مياه الري (USDA) --- */
 function salin(ec){var tds=ec*640;var cls,cx,tx;
  if(ec<0.25){cls='C1';cx='ok';tx='ملوحة منخفضة — صالحة لمعظم المحاصيل والأراضي'}
  else if(ec<0.75){cls='C2';cx='ok';tx='ملوحة متوسطة — صالحة مع غسيل معتدل'}
  else if(ec<2.25){cls='C3';cx='warn';tx='ملوحة عالية — تحتاج صرفًا جيدًا ومحاصيل متحملة'}
  else{cls='C4';cx='bad';tx='ملوحة عالية جدًا — غير مناسبة للري في الظروف العادية'}
  return{tds:tds,cls:cls,cx:cx,tx:tx,
   trace:[stp('الأملاح الكلية التقديرية','TDS≈640×EC','TDS=640×'+fmt(ec,2),'TDS≈'+fmt(tds,0)+' مجم/لتر'),
    stp('التصنيف','حدود USDA: 0.25 / 0.75 / 2.25 dS/m','EC='+fmt(ec,2)+' dS/m',cls+' — '+tx)]}}

 /* --- ١١) التطهيرات --- */
 function dredge(o){var Vv=o.L*o.W*o.d;var cost=Vv*o.rate;var days=o.prod>0?Math.ceil(Vv/o.prod):NaN;
  return{V:Vv,cost:cost,days:days,
   trace:[stp('حجم الناتج','V=الطول×متوسط العرض×سمك الإطماء','V='+fmt(o.L,0)+'×'+fmt(o.W,2)+'×'+fmt(o.d,2),'V='+fmt(Vv,0)+' م³'),
    stp('التكلفة التقديرية','ت=V×فئة السعر','ت='+fmt(Vv,0)+'×'+fmt(o.rate,1),fmt(cost,0)+' جنيه'),
    stp('المدة','أيام=V÷الإنتاجية اليومية','أيام='+fmt(Vv,0)+'/'+fmt(o.prod,0),fmt(days,0)+' يوم عمل')]}}

 /* --- ١٢) كفاية نهاية ترعة --- */
 function adequacy(qd,qr){var p=qr>0?qd/qr*100:NaN;var gr,cx;
  if(p>=90){gr='كفاية جيدة — النهاية تصلها حصتها';cx='ok'}
  else if(p>=75){gr='قصور محدود — يلزم ضبط المناوبة والتطهير الموضعي';cx='warn'}
  else{gr='قصور حاد — نهاية متعطشة، تدخل عاجل';cx='bad'}
  return{p:p,gr:gr,cx:cx,trace:[stp('مؤشر الكفاية','I=الوارد/المقرر×100','I='+fmt(qd,3)+'/'+fmt(qr,3)+'×100','I='+fmt(p,1)+'%')]}}

 /* --- ١٣) مؤشر حالة منشأ (١–٤) --- */
 function condition(scores,weights){var sw=0,ss=0,i;
  for(i=0;i<scores.length;i++){sw+=weights[i];ss+=scores[i]*weights[i]}
  var ci=ss/sw;var cls,cx,act;
  if(ci<1.5){cls='جيدة';cx='ok';act='صيانة دورية اعتيادية'}
  else if(ci<2.5){cls='تحت الملاحظة';cx='warn';act='متابعة نصف سنوية ومعالجات موضعية'}
  else if(ci<3.3){cls='تحتاج تأهيل';cx='warn';act='إدراج بخطة التأهيل وتقييد التشغيل عند الذروة'}
  else{cls='حرجة';cx='bad';act='تدخل عاجل وقيود تشغيل فورية'}
  return{ci:ci,cls:cls,cx:cx,act:act,
   trace:[stp('المؤشر المرجّح','CI=Σ(wᵢ×sᵢ)/Σwᵢ','مجموع الأوزان='+fmt(sw,2),'CI='+fmt(ci,2)+' من 4')]}}

 return{sec:sec,qman:qman,yN:yN,yC:yC,frd:frd,
  flowFromDepth:flowFromDepth,depthsFromQ:depthsFromQ,gvf:gvf,
  gateFlow:gateFlow,gateSolveA:gateSolveA,weir:weir,ratingFit:ratingFit,
  rotation:rotation,demandFao:demandFao,wellCJ:wellCJ,salin:salin,
  dredge:dredge,adequacy:adequacy,condition:condition,g:g}
})();

/* ---------- رسم بياني SVG ---------- */
function lineChart(o){var w=o.w||580,h=o.h||230,pl=48,pr=14,pt=14,pb=26,i;
 var xs=[],ys=[];o.series.forEach(function(s){s.pts.forEach(function(p){xs.push(p.x);ys.push(p.y)})});
 (o.hl||[]).forEach(function(l){ys.push(l.y)});
 if(!xs.length)return '<div class="empty"><b>لا توجد بيانات للرسم</b>أضف قراءات أولًا.</div>';
 var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
 var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
 if(x1-x0<1e-9)x1=x0+1;var yr=y1-y0;if(yr<1e-9){y0-=1;y1+=1}else{y0-=yr*0.09;y1+=yr*0.09}
 function X(x){return pl+(x-x0)/(x1-x0)*(w-pl-pr)}
 function Y(y){return pt+(1-(y-y0)/(y1-y0))*(h-pt-pb)}
 var s='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;direction:ltr" xmlns="http://www.w3.org/2000/svg">';
 for(i=0;i<=4;i++){var gy=y0+(y1-y0)*i/4;
  s+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+Y(gy).toFixed(1)+'" y2="'+Y(gy).toFixed(1)+'" stroke="var(--line)"/>';
  s+='<text x="'+(pl-6)+'" y="'+(Y(gy)+3).toFixed(1)+'" font-size="8.5" fill="var(--mut2)" text-anchor="end">'+fmt(gy,(y1-y0)>25?0:2)+'</text>'}
 (o.hl||[]).forEach(function(l){s+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+Y(l.y).toFixed(1)+'" y2="'+Y(l.y).toFixed(1)+'" stroke="'+l.c+'" stroke-width="1.3" stroke-dasharray="5 4"/>'+
  '<text x="'+(w-pr)+'" y="'+(Y(l.y)-4).toFixed(1)+'" font-size="8.5" fill="'+l.c+'" text-anchor="end" class="artx">'+esc(l.l)+'</text>'});
 o.series.forEach(function(sr){var d='';sr.pts.forEach(function(p,idx){d+=(idx?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)+' '});
  if(sr.pts.length>1)s+='<path d="'+d+'" fill="none" stroke="'+sr.c+'" stroke-width="2.1" stroke-linejoin="round" opacity="0.95"/>';
  if(sr.dots)sr.pts.forEach(function(p){s+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.7" fill="'+sr.c+'"/>'})});
 var xl=o.xlabs||[[x0,fmt(x0,0)],[(x0+x1)/2,fmt((x0+x1)/2,0)],[x1,fmt(x1,0)]];
 xl.forEach(function(p){s+='<text x="'+X(p[0]).toFixed(1)+'" y="'+(h-8)+'" font-size="8.5" fill="var(--mut2)" text-anchor="middle">'+esc(String(p[1]))+'</text>'});
 return s+'</svg>'}
function spark(vals,w,h,c){if(!vals||vals.length<2)return '';
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx-mn<1e-9)mx=mn+1;
 var d='';vals.forEach(function(v,i){var x=1+i/(vals.length-1)*(w-2),y=h-2-(v-mn)/(mx-mn)*(h-4);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '});
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="direction:ltr"><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.6"/></svg>'}
function legend(items){return '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:9.5px;color:var(--mut);margin:2px 2px 8px">'+
 items.map(function(x){return '<span><i style="display:inline-block;width:16px;height:3px;border-radius:2px;background:'+x[1]+';vertical-align:middle;margin-left:5px"></i>'+esc(x[0])+'</span>'}).join('')+'</div>'}
function linfit(xs,ys){var n=xs.length,sx=0,sy=0,sxx=0,sxy=0,i;
 for(i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i]}
 var den=n*sxx-sx*sx;if(Math.abs(den)<1e-12)return null;
 return{b:(n*sxy-sx*sy)/den,a:(sy-((n*sxy-sx*sy)/den)*sx)/n}}

/* ---------- مقطع عرضي للترعة ---------- */
function xsecSVG(b,m,y){if(!(b>0)||!(y>0)||m<0)return '';
 var W=b+2*m*y,sc=Math.min(232/Math.max(W,0.5),120/y);
 var bw=b*sc,my=m*y*sc,H=y*sc,w2=W*sc;
 var X0=(300-w2)/2,top=26,bed=top+H;
 var fb=14; /* بدل حر مرسوم */
 var p=[[X0-my*0.0,top],[X0+my,bed],[X0+my+bw,bed],[X0+w2,top]];
 function pt(a){return a[0].toFixed(1)+','+a[1].toFixed(1)}
 var s='<svg viewBox="0 0 300 '+(bed+34)+'" style="width:100%;max-width:340px;direction:ltr">';
 s+='<polyline points="'+[[p[0][0]-14,top-fb],[p[0][0],top-fb],p[0],p[1],p[2],p[3],[p[3][0],top-fb],[p[3][0]+14,top-fb]].map(pt).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="2"/>';
 s+='<polygon points="'+[p[0],p[1],p[2],p[3]].map(pt).join(' ')+'" fill="var(--aqua)" opacity="0.14"/>';
 s+='<line x1="'+p[0][0]+'" y1="'+top+'" x2="'+p[3][0]+'" y2="'+top+'" stroke="var(--aqua)" stroke-width="1.6" stroke-dasharray="6 4"/>';
 s+='<text x="150" y="'+(bed+16)+'" font-size="9" fill="var(--mut)" text-anchor="middle">b = '+fmt(b,2)+' m</text>';
 s+='<line x1="'+(p[3][0]+8)+'" y1="'+top+'" x2="'+(p[3][0]+8)+'" y2="'+bed+'" stroke="var(--mut2)" stroke-width="1"/>';
 s+='<text x="'+(p[3][0]+12)+'" y="'+((top+bed)/2+3)+'" font-size="9" fill="var(--aqua)">y='+fmt(y,2)+'</text>';
 s+='<text x="'+(p[0][0]+my/2-4)+'" y="'+((top+bed)/2)+'" font-size="8.5" fill="var(--mut)" text-anchor="end">1:'+fmt(m,1)+'</text>';
 return s+'</svg>'}

function crud(cfg){
 function form(){var b='<div class="frm">';cfg.fields.forEach(function(f){b+=fld(cfg.key+'_'+f.id,f.l,f.def,f)});
  b+='</div><div class="btnrow"><button class="btn p" data-act="'+cfg.key+'.add">＋ إضافة سجل</button>'+
     '<button class="btn g sm" data-act="'+cfg.key+'.csv">⇩ تصدير CSV</button></div>';return b}
 function table(){var rows=ST[cfg.store];
  if(!rows.length)return '<div class="empty"><b>'+esc(cfg.empty||'لا سجلات بعد')+'</b>أضف أول سجل من النموذج.</div>';
  var b='<div class="tblwrap"><table class="dt"><thead><tr>';
  cfg.cols.forEach(function(c){b+='<th>'+esc(c.h)+'</th>'});b+='<th></th></tr></thead><tbody>';
  for(var i=rows.length-1;i>=0;i--){var r=rows[i];b+='<tr>';
   cfg.cols.forEach(function(c){b+='<td class="'+(c.cls||'')+'">'+c.f(r)+'</td>'});
   b+='<td><button class="xdel" title="حذف" data-act="'+cfg.key+'.del" data-id="'+r.id+'">✕</button></td></tr>'}
  return b+'</tbody></table></div>'}
 ACT[cfg.key+'.add']=function(){var row=cfg.mk();if(!row)return;row.id=uid();
  ST[cfg.store].push(row);Store.save();rerender();toast('أُضيف السجل','ok')};
 ACT[cfg.key+'.del']=function(el){var id=el.getAttribute('data-id'),rows=ST[cfg.store],i;
  for(i=0;i<rows.length;i++)if(rows[i].id===id){rows.splice(i,1);break}
  Store.save();rerender();toast('حُذف السجل')};
 ACT[cfg.key+'.csv']=function(){var rows=[cfg.csvHead].concat(ST[cfg.store].map(cfg.csv));
  dl(cfg.csvName,csvOf(rows),'text/csv');toast('تم تصدير CSV','ok')};
 return{form:form,table:table}}
function need(v,msg){if(!isFinite(v)){toast(msg||'أكمل الحقول الرقمية أولًا','bad');return false}return true}

var LIVE_T=null;
function jget(o,p){var ks=String(p).split('.'),i;for(i=0;i<ks.length;i++){if(o==null)return undefined;o=o[ks[i]]}return o}
function liveURL(l){var base=(ST.liveBase||'').replace(/\/+$/,'');var p=((l.live&&l.live.path)||'').trim();
 if(!p)return '';p=p.split('{today}').join(todayS());
 var u=/^https?:\/\//.test(p)?p:(base?base+'/'+p.replace(/^\/+/,''):'');
 if(!u)return '';
 if(u.indexOf('.json')<0&&!/output=csv|format=csv|\.csv/.test(u)){var qi=u.indexOf('?');u=qi<0?u+'.json':u.slice(0,qi)+'.json'+u.slice(qi)}
 return u}
function autoSum(d){var out=[];
 (function walk(o,pre,dep){if(out.length>=4||dep>3||o==null)return;
  if(typeof o==='number'&&isFinite(o)){out.push({l:pre||'قيمة',v:o});return}
  if(typeof o==='object'){var ks=Object.keys(o),i;for(i=0;i<ks.length&&out.length<4;i++)if(ks[i].charAt(0)!=='#')walk(o[ks[i]],ks[i],dep+1)}})(d,'',0);
 return{vals:out,count:(d&&typeof d==='object')?Object.keys(d).length:0}}
function parseCSV(t){var rows=[],row=[],cur='',q=false,i,ch;
 for(i=0;i<t.length;i++){ch=t.charAt(i);
  if(q){if(ch==='"'){if(t.charAt(i+1)==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;
  else if(ch===','){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t.charAt(i+1)==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
  else cur+=ch}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return rows.filter(function(r){return r.join('').trim()!==''})}
function csvToObj(t){var rows=parseCSV(t);if(rows.length<2)return{'#rows':0};
 var head=rows[0].map(function(h){return String(h).trim()}),v=rows[1],d={'#rows':rows.length-1},i;
 for(i=0;i<head.length;i++){var raw=String(v[i]==null?'':v[i]).trim();
  var nv=parseFloat(raw.replace(/[\u060C,\s]/g,''));
  d[head[i]]=(raw!==''&&isFinite(nv))?nv:raw}
 return d}
function fetchLive(l,cb){var u=liveURL(l);if(!u){cb({err:'حدد قاعدة Firebase والمسار أولًا'});return}
 var isCsv=/output=csv|format=csv|\.csv/.test(u);
 var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
 var to=setTimeout(function(){if(ctl)ctl.abort()},9000);var t0=Date.now();
 fetch(u,ctl?{signal:ctl.signal}:{}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
   return isCsv?r.text().then(function(t){return csvToObj(t)}):r.json()})
 .then(function(d){clearTimeout(to);var vals,count=0;
   var topN=(d&&typeof d==='object')?((d['#rows']!==undefined)?d['#rows']:Object.keys(d).length):0;
   if(l.live.fields&&l.live.fields.length){vals=l.live.fields.map(function(f){var v;
     if(f.p==='#count')v=topN;else v=jget(d,f.p);
     if(typeof v==='number'&&isFinite(v)){if(f.s)v=v*f.s}
     else v=(v==null?null:String(v).slice(0,18));
     return{l:f.l,v:v}});count=topN}
   else{var a=autoSum(d);vals=a.vals;count=topN}
   l.live.cache={t:Date.now(),ms:Date.now()-t0,vals:vals,count:count,err:''};
   Store.save();cb(l.live.cache)})
 .catch(function(e){clearTimeout(to);l.live=l.live||{};l.live.cache=l.live.cache||{};
   l.live.cache.err=String((e&&e.message)||e);Store.save();cb({err:l.live.cache.err})})}

 if(c.err&&!c.vals)return '<div style="font-size:10px;color:var(--bad);padding:6px 0">تعذر الاتصال — '+esc(c.err)+'</div>';

  ((typeof r.v==='number')?fmt(r.v,(r.v%1===0)?0:(Math.abs(r.v)>=100?0:2)):(r.v==null?'—':esc(r.v)))+'</b></div>'}).join('');

  (c.err?'<span style="color:var(--warn)">آخر محاولة فشلت — القيم مخزّنة</span>':'')+'</div>';
 return b}

 s+=node(nodeById('zifta'),238,596);s+=node(nodeById('edfina'),102,616);

function twinBalance(){var rows='',i;
 for(i=0;i<MAIN.length-1;i++){var a=nodeById(MAIN[i]),b=nodeById(MAIN[i+1]);
  var d=a.q-b.q,p=a.q>0?d/a.q*100:0;

   '<td class="n" style="color:'+(d<0?'var(--bad)':'var(--gold2)')+'">'+fmt(d,0)+'</td><td class="n">'+fmt(p,1)+'%</td></tr>'}
 var dl2=nodeById('delta'),z=nodeById('zifta'),e=nodeById('edfina');
 var dd=dl2.q-(z.q+e.q);
 rows+='<tr><td><b>الدلتا ← الفرعان + الرياحات</b></td><td class="n">'+fmt(dl2.q,0)+'</td><td class="n">'+fmt(z.q+e.q,0)+'</td>'+
  '<td class="n" style="color:var(--gold2)">'+fmt(dd,0)+'</td><td class="n">'+fmt(dl2.q>0?dd/dl2.q*100:0,1)+'%</td></tr>';
 return '<div class="tblwrap" style="max-height:none"><table class="dt"><thead><tr><th>الوصلة</th><th>وارد</th><th>منصرف</th><th>Δ مآخذ وفواقد</th><th>%</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+

  '<div class="livegrid">'+LV.map(lvCard).join('')+'</div>';
 var LK=ST.links.filter(function(l){return l.url});
 if(LK.length)h+='<div class="head"><div><span>البوابة الموحدة</span><h2>تطبيقات مصلحة الري</h2></div>'+
  '<button class="tbtn" data-act="go" data-h="#/a/linkhub">إدارة الروابط ←</button></div>'+
  '<div class="appgrid">'+LK.map(function(l){
   return '<a class="apptile" target="_blank" rel="noopener" href="'+esc(l.url)+'" title="'+esc(l.nm)+'"><i>↗</i><span class="ico">'+esc(l.ic||'⇱')+'</span><b>'+esc(l.nm)+'</b></a>'}).join('')+'</div>';
 h+='<div class="head"><div><span>القطاعات التشغيلية</span><h2>قطاعات مصلحة الري</h2></div><span style="font-size:9.5px;color:var(--mut)">'+Object.keys(REG.apps).length+' تطبيقًا · '+Object.keys(REG.apps).filter(function(k){return REG.apps[k].tool}).length+' تفاعليًا</span></div>';
 h+=cardsOf(REG.sectors.map(function(s){var nT=s.apps.filter(function(k){return REG.apps[k].tool}).length;
  return '<button class="card" data-act="go" data-h="#/s/'+s.id+'"><div class="ico">'+s.ic+'</div><h3>'+esc(s.nm)+'</h3><p>'+esc(s.ds)+'</p>'+
  '<em><span>'+s.apps.length+' تطبيقات · '+nT+' تفاعلي</span><span>دخول ←</span></em></button>'}));
 $('view').innerHTML=h;setCrumb(['مركز القيادة'])}
function renderSector(id){var s=null,i;for(i=0;i<REG.sectors.length;i++)if(REG.sectors[i].id===id)s=REG.sectors[i];
 if(!s){renderHome();return}
 var h='<section class="sectorhero"><span class="eyebrow">قطاع تشغيلي</span><h1><span style="color:var(--aqua)">'+s.ic+'</span> '+esc(s.nm)+'</h1><p>'+esc(s.ds)+'</p></section>';
 if(s.org)h+='<div class="org">'+s.org.map(function(o){return '<div>'+esc(o[0])+'<small>'+esc(o[1])+' سجل</small></div>'}).join('')+'</div>';
 h+='<div class="head"><div><span>بوابات ونماذج</span><h2>تطبيقات '+esc(s.nm)+'</h2></div></div>'+cardsOf(s.apps.map(appCard));
 $('view').innerHTML=h;setCrumb([s.nm])}
function renderScope(k){var a=REG.apps[k],sc=a.scope,sec=REG.sectorOf(k);
 var h=appShell(k,'<div class="scope">'+
  '<div class="panel"><h3>نطاق المنظومة</h3><ul>'+sc.sc.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+
  '<div class="panel"><h3>مؤشرات الأداء</h3><ul>'+sc.kp.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+
  '<p style="font-size:10.5px;color:var(--gold2);margin:12px 0 0;font-weight:700">'+esc(sc.integ)+'</p></div></div>'+
  '<div class="panel" style="margin-top:12px"><h3>جاهزية التطوير</h3>'+
  '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut)"><span>نموذج التشغيل يُبنى على نواة المنصة الحالية (المحرك + السجلات + التقارير)</span><b class="num" style="color:var(--aqua)">'+sc.pr+'%</b></div>'+
  '<div class="progress"><i style="width:'+sc.pr+'%"></i></div>'+
  '<div class="btnrow"><button class="btn g sm" data-act="go" data-h="#/s/'+(sec?sec.id:'irrigation')+'">→ عودة للقطاع</button></div></div>');
 $('view').innerHTML=h;setCrumb([sec?sec.nm:'',a.nm])}
function restoreTab(k){var tb=TOOLS._tab&&TOOLS._tab[k];if(!tb)return;
 var btn=document.querySelector('.tabs button[data-app="'+k+'"][data-tab="'+tb+'"]');
 if(btn)ACT['ui.tab'](btn)}
function renderApp(k){var a=REG.apps[k];
 if(k==='twin'){$('view').innerHTML=TOOLS.twin.render();setCrumb(['مركز القيادة','التوأم الرقمي للنيل']);return}
 if(!a){renderHome();return}
 if(a.tool&&TOOLS[k]){$('view').innerHTML=TOOLS[k].render();if(TOOLS[k].wire)TOOLS[k].wire();restoreTab(k);
  var sec=REG.sectorOf(k);setCrumb([sec?sec.nm:'',a.nm])}
 else renderScope(k)}

/* ---------- الموجّه والقائمة ---------- */
function route(){var h=location.hash||'#/p/home';CUR.h=h;var m;
 closePal();$('side').classList.remove('open');
 if((m=h.match(/^#\/s\/(\w+)/)))renderSector(m[1]);
 else if((m=h.match(/^#\/a\/(\w+)/)))renderApp(m[1]);
 else if(h==='#/p/twin')renderApp('twin');
 else renderHome();
 markNav(h);setupLiveTimer();try{window.scrollTo(0,0)}catch(e){}}
function rerender(){route()}
ACT['go']=function(el){var h=el.getAttribute('data-h');
 if(location.hash===h)route();else location.hash=h};
function buildNav(){var b='<p class="navtitle">مركز القيادة</p>';
 b+='<button data-act="go" data-h="#/p/home"><i>▦</i>نظرة عامة</button>';
 b+='<button data-act="go" data-h="#/p/twin"><i>⌇</i>التوأم الرقمي للنيل</button>';
 b+='<p class="navtitle">قطاعات المصلحة</p>';
 REG.sectors.slice(0,5).forEach(function(s){b+='<button data-act="go" data-h="#/s/'+s.id+'"><i>'+s.ic+'</i>'+esc(s.nm)+'</button>'});
 b+='<p class="navtitle">منظومات مشتركة</p>';
 b+='<button data-act="go" data-h="#/s/shared"><i>⊞</i>التطبيقات المشتركة</button>';
 $('nav').innerHTML=b}
function markNav(h){var m=h.match(/^#\/a\/(\w+)/),sh=h;
 if(m){var sec=REG.sectorOf(m[1]);sh=sec?'#/s/'+sec.id:h;if(m[1]==='twin')sh='#/p/twin'}
 var bs=$('nav').querySelectorAll('button'),i;
 for(i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-h')===sh||bs[i].getAttribute('data-h')===h)}

/* ---------- لوحة الأوامر والبحث ---------- */
var PAL={items:[],f:[],sel:0};
function palIndex(){var it=[
 {t:'نظرة عامة — مركز القيادة',s:'المؤشرات والقطاعات',ic:'▦',h:'#/p/home',tag:'صفحة'},
 {t:'التوأم الرقمي للنيل',s:'المخطط التآزري والموازنة وعداد الحصة',ic:'⌇',h:'#/p/twin',tag:'صفحة'}];
 REG.sectors.forEach(function(s){it.push({t:s.nm,s:s.ds,ic:s.ic,h:'#/s/'+s.id,tag:'قطاع'})});
 REG.sectors.forEach(function(s){s.apps.forEach(function(k){var a=REG.apps[k];
  it.push({t:a.nm,s:a.ds,ic:a.ic,h:'#/a/'+k,tag:a.tool?'تفاعلي':'نطاق'})})});
 it.push({t:'تقرير الموقف اليومي',s:'توليد نسخة رسمية للطباعة',ic:'🖶',act:'doc.report',tag:'أمر'});
 it.push({t:'تبديل النمط ليلي / نهاري',s:'',ic:'◐',act:'ui.theme',tag:'أمر'});
 it.push({t:'نسخة احتياطية JSON',s:'تصدير كل البيانات',ic:'⇩',act:'doc.exp',tag:'أمر'});
 it.push({t:'استيراد نسخة',s:'استرجاع من ملف',ic:'⇧',act:'doc.imp',tag:'أمر'});
 it.push({t:'مسح بيانات العرض',s:'حذف السجلات الاسترشادية',ic:'⌫',act:'doc.clr',tag:'أمر'});
 it.push({t:'تثبيت التطبيق على الجهاز',s:'إضافة للشاشة الرئيسية / سطح المكتب',ic:'📲',act:'ui.install',tag:'أمر'});
 ST.links.forEach(function(l){if(l.url)it.push({t:l.nm,s:'تطبيق خارجي — '+hostOf(l.url),ic:l.ic||'⇱',url:l.url,tag:'خارجي ↗'})});
 PAL.items=it}
var PALAI=[['راجع|gvf','منحنى المياه الراجعة داخل «المعمل الهيدروليكي»'],['بواب|هدار|فتح','حسابات التشغيل في «تشغيل البوابات والهدارات»'],
 ['مناوب|زمام|مقنن','حاسبة «المناوبات والتوزيع»'],['بئر|ابار|هبوط|جوفي','قاعدة الآبار — قياسات وهبوط التشغيل'],
 ['معايره|منحنى القياس','تبويب معايرة Q–H في «المناسيب والتصرفات»'],['ملوحه|جوده|ec','تصنيف العينة في «نوعية المياه»'],
 ['تعدي|ازاله','سجل «التعديات والإزالات»'],['شكو','منظومة الشكاوى — رقم مرجعي تلقائي'],
 ['تطهير|اطماء','حاسبة «التطهيرات»'],['تقرير|طباعه','أمر «تقرير الموقف اليومي»'],['حصه|55','عدّاد الحصة داخل التوأم الرقمي']];
function palOpen(){palIndex();$('pal').classList.add('show');var i=$('palin');i.value='';palFilter();setTimeout(function(){i.focus()},30)}
function closePal(){var p=$('pal');if(p)p.classList.remove('show')}
ACT['pal.open']=palOpen;
function palFilter(){var q=nrm(VS('palin'));
 PAL.f=PAL.items.filter(function(x){return !q||nrm(x.t+' '+x.s).indexOf(q)>=0}).slice(0,12);
 PAL.sel=0;
 $('pallist').innerHTML=PAL.f.length?PAL.f.map(function(x,i){
  return '<div class="pitem'+(i===PAL.sel?' sel':'')+'" data-act="pal.go" data-i="'+i+'"><div class="ico">'+x.ic+'</div>'+
  '<div style="flex:1"><div>'+esc(x.t)+'</div><small>'+esc(x.s)+'</small></div><span class="tag">'+esc(x.tag)+'</span></div>'}).join(''):
  '<div class="empty" style="margin:8px"><b>لا نتائج</b>جرّب كلمة أقصر.</div>';
 var hint='';for(var i=0;i<PALAI.length&&!hint;i++){var ks=PALAI[i][0].split('|');
  for(var j=0;j<ks.length;j++)if(q&&q.indexOf(nrm(ks[j]))>=0){hint='اقتراح: '+PALAI[i][1];break}}
 $('palai').textContent=hint}
function palExec(i){var x=PAL.f[i];if(!x)return;closePal();
 if(x.url){window.open(x.url,'_blank');return}
 if(x.h){if(location.hash===x.h)route();else location.hash=x.h}
 else if(x.act&&ACT[x.act])ACT[x.act]()}
ACT['pal.go']=function(el){palExec(+el.getAttribute('data-i'))};

/* ---------- النمط والساعة والمعالجات ---------- */
function applyTheme(){document.documentElement.setAttribute('data-theme',ST.theme);
 var b=$('thbtn');if(b)b.textContent=ST.theme==='dark'?'◐':'◑'}
ACT['ui.theme']=function(){ST.theme=ST.theme==='dark'?'light':'dark';Store.save();applyTheme()};
function tick(){var d=new Date();
 $('clk').textContent=d.toLocaleTimeString('en-GB')+'  ·  '+todayS()}
var CVF={q1:0.0864,a1:4200,c1:175,d1:1/86.4,e1:640};
function onInput(e){var t=e.target;if(!t.id)return;
 if(t.id==='palin'){palFilter();return}
 var m=t.id.match(/^cv_(\w\d)_(a|b)$/);if(!m)return;
 var f=CVF[m[1]],v=parseFloat(t.value),o=$('cv_'+m[1]+'_'+(m[2]==='a'?'b':'a'));
 if(!o)return;o.value=isFinite(v)?String(parseFloat((m[2]==='a'?v*f:v/f).toFixed(5))):''}
function onClick(e){var t=e.target.closest('[data-act]');if(!t)return;
 var a=t.getAttribute('data-act');if(ACT[a]){e.preventDefault();ACT[a](t,e)}}
function onKey(e){
 if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K'||e.key==='ن')){e.preventDefault();
  if($('pal').classList.contains('show'))closePal();else palOpen();return}
 var open=$('pal').classList.contains('show');
 if(e.key==='Escape'){closePal();$('modal').classList.remove('show');return}
 if(!open)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
  PAL.sel=Math.max(0,Math.min(PAL.f.length-1,PAL.sel+(e.key==='ArrowDown'?1:-1)));
  var its=$('pallist').querySelectorAll('.pitem'),i;
  for(i=0;i<its.length;i++)its[i].classList.toggle('sel',i===PAL.sel)}
 else if(e.key==='Enter'){e.preventDefault();palExec(PAL.sel)}}
function onImport(e){var f=e.target.files[0];if(!f)return;
 var rd=new FileReader();
 rd.onload=function(){try{var o=JSON.parse(rd.result);
   if(!o||o.ver!==2||!o.twin)throw 0;
   Object.keys(ST).forEach(function(k){delete ST[k]});
   for(var k in o)ST[k]=o[k];
   if(!ST.links)ST.links=Store.defLinks();ST.links=ST.links.filter(function(l){return !(l.id==='lk_penta'&&!l.url)});Store.upgradeLinks(ST);
   Store.save();applyTheme();route();toast('استُرجعت النسخة بنجاح','ok')}
  catch(x){toast('ملف غير صالح — يجب أن يكون نسخة v2 من المنصة','bad')}};
 rd.readAsText(f);e.target.value=''}

/* ---- التثبيت وعامل الخدمة (PWA) ---- */
var PWAP=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();PWAP=e;
 var b=$('instbtn');if(b)b.style.display='inline-flex'});
window.addEventListener('appinstalled',function(){PWAP=null;
 var b=$('instbtn');if(b)b.style.display='none';toast('ثُبّت التطبيق على الجهاز ✓','ok')});
ACT['ui.install']=function(){
 if(PWAP){PWAP.prompt();PWAP.userChoice.then(function(){PWAP=null;
  var b=$('instbtn');if(b)b.style.display='none'});return}
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent||'');
 showModal('<h2>📲 تثبيت التطبيق على الجهاز</h2><p style="font-size:11.5px;color:var(--mut);line-height:2.2">'+
  (ios?'في سفارى: اضغط زر المشاركة ⬆︎ ثم اختر «إضافة إلى الشاشة الرئيسية».'
      :'افتح المنصة من رابط GitHub Pages (https) ثم من قائمة المتصفح ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».')+
  '</p><button class="btn p" data-act="ui.mclose">تمام</button>')};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
 try{navigator.serviceWorker.register('./sw.js').catch(function(){})}catch(e){}}

window.addEventListener('DOMContentLoaded',function(){
 ST=Store.load();Store.seed();applyTheme();buildNav();palIndex();
 var ch=$('stchip');if(!LSW.ok){ch.className='chip off';$('sttx').textContent='جلسة مؤقتة — الحفظ الدائم غير متاح هنا'}
 window.addEventListener('hashchange',route);route();
 tick();setInterval(tick,1000);
 document.addEventListener('click',onClick);
 document.addEventListener('input',onInput);
 document.addEventListener('keydown',onKey);
 $('impfile').addEventListener('change',onImport);
 $('men').addEventListener('click',function(){$('side').classList.toggle('open')});
 $('pal').addEventListener('click',function(e){if(e.target===$('pal'))closePal()});
 $('modal').addEventListener('click',function(e){if(e.target===$('modal'))$('modal').classList.remove('show')});
});
